<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Personal Course Studio</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f4f8ff;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      min-height: 100vh;

      overflow-x: hidden;
    }


    /* ==========================================
       TOPBAR
    ========================================== */

    .topbar {
      height: 70px;

      background: #ffffff;

      border-bottom:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 20px;

      position: relative;

      z-index: 100;
    }


    .topbar-left {
      display: flex;

      align-items: center;

      gap: 11px;

      min-width: 0;
    }


    .studio-logo {
      width: 42px;

      height: 42px;

      min-width: 42px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #06b6d4
        );

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 14px;

      font-weight: 800;

      overflow: hidden;

      white-space: nowrap;
    }


    .top-title {
      min-width: 0;
    }


    .top-title h1 {
      font-size: 17px;

      line-height: 1.2;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .top-title p {
      color: var(--muted);

      font-size: 11px;

      margin-top: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .top-actions {
      display: flex;

      align-items: center;

      gap: 8px;
    }


    button {
      border: 0;

      cursor: pointer;

      font-family: inherit;
    }


    .top-btn {
      padding:
        9px 13px;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 700;
    }


    .admin-btn {
      background: #eff6ff;

      color: #2563eb;
    }


    .logout-btn {
      background: #fef2f2;

      color: #dc2626;
    }


    /* ==========================================
       MAIN
    ========================================== */

    .page {
      max-width: 1450px;

      margin: 0 auto;

      padding: 20px;
    }


    .studio-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        300px;

      gap: 18px;

      align-items: start;
    }


    /* ==========================================
       STAGE
    ========================================== */

    .stage {
      position: relative;

      min-height: 650px;

      background:
        linear-gradient(
          145deg,
          #fafdff,
          #edf5ff
        );

      border:
        1px solid #dbe7f5;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 45px
        rgba(15, 23, 42, 0.07);
    }


    .stage-content {
      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 30px;

      text-align: center;

      pointer-events: none;
    }


    .stage-content h2 {
      font-size: 28px;

      margin-bottom: 10px;
    }


    .stage-content p {
      color: var(--muted);

      max-width: 600px;

      line-height: 1.6;
    }


    .empty-icon {
      width: 72px;

      height: 72px;

      border-radius: 20px;

      background: #ffffff;

      box-shadow:
        0 8px 25px
        rgba(37, 99, 235, 0.10);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 32px;

      margin-bottom: 18px;
    }


    /* ==========================================
       MAIN CONTENT IMAGE / VIDEO
    ========================================== */

    #mainImage,
    #mainVideo {

      position: absolute;

      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      display: none;

      inset: 0;

      margin: auto;

      z-index: 3;
    }


    #mainImage {
      width: 100%;

      height: 100%;

      object-fit: contain;

      padding: 20px;
    }


    #mainVideo {
      width: 100%;

      height: 100%;

      background: #000000;
    }


    /* ==========================================
       STAGE LABEL
    ========================================== */

    .stage-label {

      position: absolute;

      left: 28px;

      top: 28px;

      z-index: 20;

      background:
        rgba(255, 255, 255, 0.94);

      border:
        1px solid
        rgba(37, 99, 235, 0.15);

      padding:
        9px 14px;

      border-radius: 11px;

      font-size: 13px;

      font-weight: 800;

      color: #1d4ed8;

      box-shadow:
        0 7px 20px
        rgba(15, 23, 42, 0.08);

      cursor: move;

      user-select: none;

      touch-action: none;
    }


    /* ==========================================
       BRAND BADGE
    ========================================== */

    .brand-badge {

      position: absolute;

      left: 28px;

      bottom: 28px;

      z-index: 25;

      background:
        rgba(255, 255, 255, 0.96);

      border:
        1px solid
        rgba(37, 99, 235, 0.15);

      padding:
        8px 13px;

      border-radius: 10px;

      font-size: 12px;

      font-weight: 800;

      color: #2563eb;

      box-shadow:
        0 8px 20px
        rgba(15, 23, 42, 0.08);

      cursor: move;

      user-select: none;

      touch-action: none;
    }


    /* ==========================================
       MENTOR CARD
    ========================================== */

    .mentor-card {

      position: absolute;

      right: 25px;

      top: 25px;

      width: 230px;

      height: 145px;

      z-index: 30;

      background:
        linear-gradient(
          135deg,
          #dbeafe,
          #eff6ff
        );

      border:
        2px solid
        rgba(37, 99, 235, 0.15);

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 12px 30px
        rgba(15, 23, 42, 0.13);

      cursor: move;

      touch-action: none;
    }


    .mentor-placeholder {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 7px;

      color: #2563eb;

      text-align: center;

      padding: 10px;
    }


    .mentor-placeholder-icon {
      font-size: 27px;
    }


    .mentor-placeholder span {
      font-size: 11px;

      font-weight: 700;
    }


    #mentorVideo {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: none;

      background: #000000;
    }


    /* ==========================================
       STUDENT PANEL
    ========================================== */

    .side-panel {
      background: #ffffff;

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 17px;

      box-shadow:
        0 10px 30px
        rgba(15, 23, 42, 0.05);
    }


    .side-title {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 15px;
    }


    .side-title h3 {
      font-size: 16px;
    }


    .student-count {
      background: #eff6ff;

      color: #2563eb;

      border-radius: 20px;

      padding: 5px 9px;

      font-size: 11px;

      font-weight: 800;
    }


    .student-list {
      display: grid;

      gap: 9px;

      max-height: 450px;

      overflow-y: auto;
    }


    .student-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 9px;

      background: #f8fbff;

      border:
        1px solid #edf2f7;

      border-radius: 11px;
    }


    .student-photo {
      width: 36px;

      height: 36px;

      min-width: 36px;

      border-radius: 50%;

      background: #dbeafe;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      color: #2563eb;

      font-weight: 800;

      font-size: 12px;
    }


    .student-photo img {
      width: 100%;

      height: 100%;

      object-fit: cover;
    }


    .student-info {
      min-width: 0;
    }


    .student-name {
      font-size: 13px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .student-status {
      font-size: 10px;

      color: #16a34a;

      margin-top: 2px;
    }


    .empty-students {
      padding: 25px 10px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
    }


    /* ==========================================
       TOOLBAR
    ========================================== */

    .toolbar {
      margin-top: 15px;

      background: #ffffff;

      border:
        1px solid var(--border);

      border-radius: 16px;

      padding: 11px;

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 8px;

      box-shadow:
        0 8px 25px
        rgba(15, 23, 42, 0.05);
    }


    .tool-btn {
      padding:
        10px 13px;

      border-radius: 10px;

      background: #f8fafc;

      border:
        1px solid #e2e8f0;

      color: #334155;

      font-size: 12px;

      font-weight: 700;
    }


    .tool-btn:hover {
      background: #eff6ff;

      color: #2563eb;
    }


    .record-btn {
      background: #fee2e2;

      color: #dc2626;

      border-color: #fecaca;
    }


    .status {
      margin-left: auto;

      font-size: 11px;

      color: var(--muted);

      padding:
        0 6px;
    }


    /* ==========================================
       HIDDEN FILE INPUTS
    ========================================== */

    .hidden {
      display: none;
    }


    /* ==========================================
       SETTINGS MODAL
    ========================================== */

    .modal-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(15, 23, 42, 0.48);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 500;
    }


    .modal-overlay.show {
      display: flex;
    }


    .modal {

      width: 100%;

      max-width: 450px;

      background: #ffffff;

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.22);
    }


    .modal-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;
    }


    .modal-header h3 {
      font-size: 18px;
    }


    .close-btn {

      width: 34px;

      height: 34px;

      border-radius: 9px;

      background: #f1f5f9;

      font-size: 18px;

      color: #475569;
    }


    .form-group {
      margin-bottom: 15px;
    }


    .form-group label {
      display: block;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 7px;
    }


    .form-group input,
    .form-group select {

      width: 100%;

      padding: 11px 12px;

      border:
        1px solid #dbe3ed;

      border-radius: 10px;

      outline: none;

      font-family: inherit;
    }


    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
    }


    .modal-actions {

      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 20px;
    }


    .save-btn {

      padding:
        10px 16px;

      background: #2563eb;

      color: white;

      border-radius: 10px;

      font-weight: 800;
    }


    /* ==========================================
       RECORDING
    ========================================== */

    .recording {
      animation:
        recordingPulse
        1.2s infinite;
    }


    @keyframes recordingPulse {

      0% {
        box-shadow:
          0 0 0 0
          rgba(220, 38, 38, 0.35);
      }

      70% {
        box-shadow:
          0 0 0 10px
          rgba(220, 38, 38, 0);
      }

      100% {
        box-shadow:
          0 0 0 0
          rgba(220, 38, 38, 0);
      }

    }


    /* ==========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 1000px) {

      .studio-layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        order: 2;
      }

      .stage {
        min-height: 580px;
      }

    }


    @media (max-width: 650px) {

      .topbar {
        height: auto;

        min-height: 68px;

        padding:
          10px 12px;
      }


      .top-title h1 {
        font-size: 14px;
      }


      .top-title p {
        display: none;
      }


      .admin-btn {
        display: none;
      }


      .page {
        padding: 12px;
      }


      .stage {
        min-height: 480px;

        border-radius: 15px;
      }


      .stage-content {
        padding: 20px;
      }


      .stage-content h2 {
        font-size: 21px;
      }


      .mentor-card {
        width: 155px;

        height: 100px;

        right: 12px;

        top: 12px;
      }


      .stage-label {
        left: 12px;

        top: 12px;

        font-size: 10px;

        padding:
          7px 9px;
      }


      .brand-badge {
        left: 12px;

        bottom: 12px;

        font-size: 10px;

        padding:
          6px 9px;
      }


      .toolbar {
        padding: 8px;
      }


      .tool-btn {
        padding:
          9px 10px;

        font-size: 11px;
      }


      .status {
        width: 100%;

        margin-left: 0;

        padding: 4px;
      }

    }

  </style>
</head>


<body>

  <!-- ==========================================
       LOGIN PROTECTION
  =========================================== -->

  <script>

    const SESSION_KEY =
      "personalCourseStudioLoggedIn";

    if (
      sessionStorage.getItem(
        SESSION_KEY
      ) !== "true"
    ) {

      window.location.replace(
        "login.html"
      );

    }

  </script>


  <!-- ==========================================
       TOPBAR
  =========================================== -->

  <header class="topbar">

    <div class="topbar-left">

      <div
        class="studio-logo"
        id="studioLogo"
      >
        CS
      </div>

      <div class="top-title">

        <h1 id="studioName">
          Personal Course Studio
        </h1>

        <p id="studioSubtitle">
          নিজের ক্লাস ও কোর্স ভিডিও তৈরির জন্য
        </p>

      </div>

    </div>


    <div class="top-actions">

      <button
        class="top-btn admin-btn"
        onclick="openAdmin()"
      >
        ⚙ Admin
      </button>

      <button
        class="top-btn logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- ==========================================
       MAIN
  =========================================== -->

  <main class="page">

    <div class="studio-layout">


      <!-- ======================================
           LEFT / STUDIO
      ======================================= -->

      <section>

        <div
          class="stage"
          id="stage"
        >


          <!-- Welcome -->

          <div
            class="stage-content"
            id="stageWelcome"
          >

            <div class="empty-icon">
              🎬
            </div>

            <h2>
              Welcome
            </h2>

            <p id="welcomeText">
              আপনার ক্লাস শুরু করার জন্য প্রস্তুত?
            </p>

          </div>


          <!-- Main Image -->

          <img
            id="mainImage"
            alt="Main Content"
          >


          <!-- Main Video -->

          <video
            id="mainVideo"
            controls
            playsinline
          ></video>


          <!-- Draggable Stage Label -->

          <div
            class="stage-label"
            id="stageLabel"
          >
            Shah Neil Khan / USHA.AI
          </div>


          <!-- Draggable Brand -->

          <div
            class="brand-badge"
            id="brandBadge"
          >
            Shah Neil Khan / USHA.AI
          </div>


          <!-- Mentor -->

          <div
            class="mentor-card"
            id="mentorCard"
          >

            <div
              class="mentor-placeholder"
              id="mentorPlaceholder"
            >

              <div
                class="mentor-placeholder-icon"
              >
                🎥
              </div>

              <span>
                Mentor Video
              </span>

            </div>

            <video
              id="mentorVideo"
              controls
              playsinline
            ></video>

          </div>


        </div>


        <!-- ==================================
             TOOLBAR
        =================================== -->

        <div class="toolbar">


          <button
            class="tool-btn"
            onclick="document
              .getElementById('imageInput')
              .click()"
          >
            🖼 Slide / Image
          </button>


          <button
            class="tool-btn"
            onclick="document
              .getElementById('mainVideoInput')
              .click()"
          >
            🎬 Main Video
          </button>


          <button
            class="tool-btn"
            onclick="document
              .getElementById('mentorVideoInput')
              .click()"
          >
            🎥 Mentor Video
          </button>


          <button
            class="tool-btn"
            onclick="clearContent()"
          >
            🗑 Clear
          </button>


          <button
            class="tool-btn"
            onclick="toggleMainVideo()"
          >
            ▶ / ⏸ Play
          </button>


          <button
            class="tool-btn"
            onclick="fullscreenStage()"
          >
            ⛶ Fullscreen
          </button>


          <button
            class="tool-btn record-btn"
            id="recordButton"
            onclick="toggleRecording()"
          >
            🔴 Record
          </button>


          <div
            class="status"
            id="status"
          >
            Ready
          </div>

        </div>


        <!-- Hidden inputs -->

        <input
          type="file"
          id="imageInput"
          class="hidden"
          accept="image/*"
        >


        <input
          type="file"
          id="mainVideoInput"
          class="hidden"
          accept="video/*"
        >


        <input
          type="file"
          id="mentorVideoInput"
          class="hidden"
          accept="video/*"
        >

      </section>


      <!-- ======================================
           RIGHT / STUDENTS
      ======================================= -->

      <aside class="side-panel">

        <div class="side-title">

          <h3 id="zoomTitle">
            Zoom Demo
          </h3>

          <span
            class="student-count"
            id="studentCount"
          >
            0 Students
          </span>

        </div>


        <div
          class="student-list"
          id="studentList"
        >

          <div class="empty-students">
            এখনো কোনো student যোগ করা হয়নি।
          </div>

        </div>

      </aside>


    </div>

  </main>


  <!-- ==========================================
       SETTINGS MODAL
  =========================================== -->

  <div
    class="modal-overlay"
    id="settingsModal"
  >

    <div class="modal">

      <div class="modal-header">

        <h3>
          Studio Settings
        </h3>

        <button
          class="close-btn"
          onclick="closeSettings()"
        >
          ×
        </button>

      </div>


      <div class="form-group">

        <label>
          Studio Name
        </label>

        <input
          id="modalStudioName"
          type="text"
        >

      </div>


      <div class="form-group">

        <label>
          Subtitle
        </label>

        <input
          id="modalStudioSubtitle"
          type="text"
        >

      </div>


      <div class="form-group">

        <label>
          Brand
        </label>

        <select
          id="modalBrand"
        ></select>

      </div>


      <div class="modal-actions">

        <button
          class="top-btn admin-btn"
          onclick="closeSettings()"
        >
          Cancel
        </button>

        <button
          class="save-btn"
          onclick="saveLocalSettings()"
        >
          Save
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ==========================================
       STORAGE
    ========================================== */

    const SETTINGS_KEY =
      "personalCourseStudioSettings";

    const BRANDS_KEY =
      "personalCourseStudioBrands";


    /* ==========================================
       DEFAULT
    ========================================== */

    const defaultSettings = {

      studioName:
        "Personal Course Studio",

      studioSubtitle:
        "নিজের ক্লাস ও কোর্স ভিডিও তৈরির জন্য",

      studioLogo:
        "CS",

      selectedBrand:
        "Shah Neil Khan / USHA.AI",

      zoomTitle:
        "Zoom Demo",

      welcomeText:
        "আপনার ক্লাস শুরু করার জন্য প্রস্তুত?"

    };


    const defaultBrands = [

      "Shah Neil Khan / USHA.AI",

      "SNK AI Academy",

      "SNK IT Institute",

      "My Personal Studio",

      "Custom Brand"

    ];


    /* ==========================================
       SETTINGS
    ========================================== */

    function getSettings() {

      try {

        const saved =
          localStorage.getItem(
            SETTINGS_KEY
          );

        if (!saved) {

          return {
            ...defaultSettings
          };

        }

        return {
          ...defaultSettings,
          ...JSON.parse(saved)
        };

      } catch (error) {

        return {
          ...defaultSettings
        };

      }

    }


    function getBrands() {

      try {

        const saved =
          localStorage.getItem(
            BRANDS_KEY
          );

        if (!saved) {

          return [
            ...defaultBrands
          ];

        }

        const brands =
          JSON.parse(saved);

        if (
          !Array.isArray(brands)
        ) {

          return [
            ...defaultBrands
          ];

        }

        return brands;

      } catch (error) {

        return [
          ...defaultBrands
        ];

      }

    }


    /* ==========================================
       APPLY ADMIN SETTINGS
    ========================================== */

    function applyAdminSettings() {

      const settings =
        getSettings();


      /* Studio Name */

      document.getElementById(
        "studioName"
      ).textContent =
        settings.studioName;


      /* Subtitle */

      document.getElementById(
        "studioSubtitle"
      ).textContent =
        settings.studioSubtitle;


      /* Logo */

      document.getElementById(
        "studioLogo"
      ).textContent =
        settings.studioLogo;


      /* Brand */

      document.getElementById(
        "stageLabel"
      ).textContent =
        settings.selectedBrand;


      document.getElementById(
        "brandBadge"
      ).textContent =
        settings.selectedBrand;


      /* Zoom */

      document.getElementById(
        "zoomTitle"
      ).textContent =

    /* ==========================================
       DRAGGABLE
    ========================================== */

    function makeDraggable(
      element,
      container
    ) {

      let dragging = false;

      let startX = 0;

      let startY = 0;

      let startLeft = 0;

      let startTop = 0;


      function pointerDown(
        event
      ) {

        dragging = true;


        const point =
          event.touches
            ? event.touches[0]
            : event;


        const elementRect =
          element.getBoundingClientRect();


        const containerRect =
          container.getBoundingClientRect();


        startX =
          point.clientX;

        startY =
          point.clientY;


        startLeft =
          elementRect.left -
          containerRect.left;


        startTop =
          elementRect.top -
          containerRect.top;


        element.style.left =
          startLeft + "px";

        element.style.top =
          startTop + "px";

        element.style.right =
          "auto";

        element.style.bottom =
          "auto";


        element.style.cursor =
          "grabbing";


        event.preventDefault();

      }


      function pointerMove(
        event
      ) {

        if (!dragging) {
          return;
        }


        const point =
          event.touches
            ? event.touches[0]
            : event;


        const containerRect =
          container.getBoundingClientRect();


        const elementRect =
          element.getBoundingClientRect();


        let newLeft =
          startLeft +
          (
            point.clientX -
            startX
          );


        let newTop =
          startTop +
          (
            point.clientY -
            startY
          );


        const maxLeft =
          containerRect.width -
          elementRect.width;


        const maxTop =
          containerRect.height -
          elementRect.height;


        newLeft =
          Math.max(
            0,
            Math.min(
              newLeft,
              maxLeft
            )
          );


        newTop =
          Math.max(
            0,
            Math.min(
              newTop,
              maxTop
            )
          );


        element.style.left =
          newLeft + "px";

        element.style.top =
          newTop + "px";


        event.preventDefault();

      }


      function pointerUp() {

        dragging = false;

        element.style.cursor =
          "move";

      }


      element.addEventListener(
        "mousedown",
        pointerDown
      );

      document.addEventListener(
        "mousemove",
        pointerMove
      );

      document.addEventListener(
        "mouseup",
        pointerUp
      );


      element.addEventListener(
        "touchstart",
        pointerDown,
        {
          passive: false
        }
      );

      document.addEventListener(
        "touchmove",
        pointerMove,
        {
          passive: false
        }
      );

      document.addEventListener(
        "touchend",
        pointerUp
      );

    }


    /* ==========================================
       RECORDING
    ========================================== */

    let mediaRecorder = null;

    let recordedChunks = [];

    let recordingStream = null;


    async function toggleRecording() {

      if (
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
      ) {

        mediaRecorder.stop();

        return;

      }


      try {

        recordingStream =
          await navigator
            .mediaDevices
            .getDisplayMedia({

              video: true,

              audio: true

            });


        recordedChunks = [];


        mediaRecorder =
          new MediaRecorder(
            recordingStream
          );


        mediaRecorder.ondataavailable =
          function(event) {

            if (
              event.data.size > 0
            ) {

              recordedChunks.push(
                event.data
              );

            }

          };


        mediaRecorder.onstop =
          function() {

            const blob =
              new Blob(
                recordedChunks,
                {
                  type:
                    "video/webm"
                }
              );


            const url =
              URL.createObjectURL(
                blob
              );


            const a =
              document.createElement(
                "a"
              );


            a.href = url;

            a.download =
              "course-recording-" +
              Date.now() +
              ".webm";


            a.click();


            URL.revokeObjectURL(
              url
            );


            if (
              recordingStream
            ) {

              recordingStream
                .getTracks()
                .forEach(
                  function(track) {

                    track.stop();

                  }
                );

            }


            const button =
              document.getElementById(
                "recordButton"
              );


            button.classList.remove(
              "recording"
            );


            button.textContent =
              "🔴 Record";


            setStatus(
              "Recording saved"
            );

          };


        mediaRecorder.start();


        const button =
          document.getElementById(
            "recordButton"
          );


        button.classList.add(
          "recording"
        );


        button.textContent =
          "⏹ Stop Recording";


        setStatus(
          "Recording..."
        );


        recordingStream
          .getVideoTracks()
          [0]
          .addEventListener(
            "ended",
            function() {

              if (
                mediaRecorder &&
                mediaRecorder.state ===
                "recording"
              ) {

                mediaRecorder.stop();

              }

            }
          );


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          "Recording cancelled"
        );

      }

    }
