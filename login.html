<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign In — Personal Course Studio</title>

  <style>
    :root {
      --bg: #f5f8fb;
      --card: #ffffff;
      --border: #e1e7ed;
      --text: #20252b;
      --muted: #7b858f;
      --blue: #dceefe;
      --blue-dark: #356886;
      --danger: #c95858;
      --shadow: 0 18px 55px rgba(25, 50, 70, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family:
        Inter,
        "Segoe UI",
        Arial,
        "Noto Sans Bengali",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top left,
          #eaf5ff 0,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #eef8f4 0,
          transparent 35%
        ),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .login-card {
      width: 100%;
      max-width: 390px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 30px;

      box-shadow: var(--shadow);
    }

    .logo {
      width: 62px;
      height: 62px;

      margin: 0 auto 18px;

      border-radius: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--blue);
      color: var(--blue-dark);

      font-size: 22px;
      font-weight: 700;

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 21px;
      font-weight: 600;
      color: var(--text);
    }

    .title p {
      margin-top: 7px;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .form {
      margin-top: 25px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      color: #606a73;
      font-size: 11px;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 43px;

      border: 1px solid var(--border);
      border-radius: 9px;

      padding: 0 12px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 12px;

      transition: 0.2s ease;
    }

    .input:focus {
      border-color: #b7d8ef;

      box-shadow:
        0 0 0 3px
        rgba(183, 216, 239, 0.18);
    }

    .password-input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: #78838d;

      font-size: 10px;
      padding: 5px;

      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      height: 43px;

      border: 1px solid #c5dff1;
      border-radius: 9px;

      background: #e6f3fd;
      color: #376681;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .login-btn:hover {
      background: #dceefb;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .error {
      min-height: 18px;

      margin-top: 11px;

      text-align: center;

      color: var(--danger);

      font-size: 10px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #9aa2aa;

      font-size: 9px;
    }

    .footer strong {
      color: #6f7a84;
      font-weight: 500;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .loading.show {
      display: flex;
    }

    .loading-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #648aa3;

      animation: loading 0.9s infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes loading {
      0%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 24px 20px;
        border-radius: 15px;
      }

      .title h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">
      <span id="logoText">CS</span>

      <img
        id="logoImage"
        alt="Studio Logo"
      />
    </div>

    <div class="title">

      <h1 id="studioName">
        Personal Course Studio
      </h1>

      <p id="studioSubtitle">
        নিজের ক্লাস ও কোর্স ভিডিও তৈরির জন্য
      </p>

    </div>


    <form
      class="form"
      id="loginForm"
    >

      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          class="input"
          type="text"
          autocomplete="username"
          placeholder="Username লিখুন"
          required
        />

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="input password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Password লিখুন"
            required
          />

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >

        <span id="loginText">
          Sign In
        </span>

        <span
          class="loading"
          id="loading"
        >

          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>

        </span>

      </button>


      <div
        class="error"
        id="errorMessage"
      ></div>

    </form>


    <div class="footer">
      Private Studio ·
      <strong>Authorized Access Only</strong>
    </div>

  </main>


  <script>
    /* =========================================================
       PERSONAL COURSE STUDIO
       LOGIN SYSTEM — 01.1
       ========================================================= */


    /* =========================================================
       LOGIN CONFIG
       ========================================================= */

    /*
      IMPORTANT:

      এই credentials এখন demo/local version-এর জন্য।

      পরের ধাপে Admin Panel তৈরি হলে
      এগুলো Admin থেকে পরিবর্তন করা যাবে।

      এই username/password production security-এর জন্য
      ব্যবহার করবেন না যতক্ষণ না server-side authentication
      যোগ করা হয়।
    */

    const LOGIN_USERNAME = "admin";
    const LOGIN_PASSWORD = "123456";


    /* =========================================================
       SESSION KEY
       ========================================================= */

    const SESSION_KEY =
      "personalCourseStudioLoggedIn";


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loginForm =
      document.getElementById("loginForm");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginText =
      document.getElementById("loginText");

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("errorMessage");

    const showPassword =
      document.getElementById("showPassword");


    /* =========================================================
       IF ALREADY LOGGED IN
       ========================================================= */

    if (
      sessionStorage.getItem(SESSION_KEY) === "true"
    ) {

      window.location.href = "index.html";

    }


    /* =========================================================
       SHOW / HIDE PASSWORD
       ========================================================= */

    showPassword.addEventListener(
      "click",
      function () {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        showPassword.textContent =
          isPassword
            ? "Hide"
            : "Show";

      }
    );


    /* =========================================================
       LOGIN
       ========================================================= */

    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const username =
          usernameInput.value.trim();

        const password =
          passwordInput.value;


        errorMessage.textContent = "";


        if (!username || !password) {

          errorMessage.textContent =
            "Username এবং Password দিন।";

          return;

        }


        loginButton.disabled = true;

        loginText.style.display = "none";

        loading.classList.add("show");


        /*
          ছোট delay রাখা হয়েছে যাতে login
          transition natural লাগে।
        */

        setTimeout(
          function () {

            if (
              username === LOGIN_USERNAME &&
              password === LOGIN_PASSWORD
            ) {

              sessionStorage.setItem(
                SESSION_KEY,
                "true"
              );

              sessionStorage.setItem(
                "personalCourseStudioLoginTime",
                Date.now().toString()
              );


              window.location.href =
                "index.html";


              return;

            }


            /* WRONG LOGIN */

            loginButton.disabled = false;

            loginText.style.display =
              "inline";

            loading.classList.remove(
              "show"
            );

            errorMessage.textContent =
              "Username অথবা Password সঠিক নয়।";

            passwordInput.value = "";

            passwordInput.focus();

          },
          650
        );

      }
    );


    /* =========================================================
       ENTER KEY
       ========================================================= */

    passwordInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          loginForm.requestSubmit();

        }

      }
    );

  </script>

</body>
</html>
